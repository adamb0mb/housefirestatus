name = "housefirestatus"
main = "worker/index.js"
compatibility_date = "2026-08-01"

# Served both from its own workers.dev URL (root-level) and from
# phillabaum.us/spokanefire (path-scoped route on a zone that's shared with
# other Workers) — see PATH_PREFIX handling in worker/index.js. Adding an
# explicit `routes` entry makes wrangler disable workers_dev by default, so
# it has to be turned back on explicitly to keep both URLs live.
workers_dev = true
routes = [
  { pattern = "phillabaum.us/spokanefire*", zone_name = "phillabaum.us" }
]

[assets]
directory = "./public"
binding = "ASSETS"
# The Worker needs to see every request, not just /api/*, so it can strip the
# /spokanefire prefix (when present) before looking up static assets too.
run_worker_first = true

[observability]
enabled = true

[vars]
# Used to build absolute links (confirm/unsubscribe/status-page) in notification
# emails sent from the scheduled() handler, which has no request context to infer
# a URL from.
PUBLIC_BASE_URL = "https://phillabaum.us/spokanefire"

# Re-checks every confirmed subscription and emails whoever's status changed.
# Once every 15 minutes — frequent enough during a fast-moving incident without
# hammering upstream provider APIs.
[triggers]
crons = ["*/15 * * * *"]

# Subscription storage.
[[d1_databases]]
binding = "DB"
database_name = "housefirestatus-subscriptions"
database_id = "7743ad9d-0b40-42e1-ae40-1f4e4622479d"
